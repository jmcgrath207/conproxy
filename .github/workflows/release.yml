# conproxy release workflow — tag / manual only.
#
# Triggered on `v*` tags (e.g. v0.1.0) and `workflow_dispatch`. Publishes
# artifacts only:
#
#   - cross-compiles for x86_64-musl and aarch64-gnu
#   - smoke-tests the aarch64 binary under qemu
#   - builds + publishes a multi-arch container image (amd64 + arm64) to GHCR
#   - builds + publishes a Helm chart to OCI on GHCR
#   - creates a GitHub Release and attaches binaries + chart
#
# All testing (fmt, clippy, lib tests, mcp_test, integration, integration-
# experimental, security audit, fuzz, e2e, UAT) lives in `ci.yml` and
# must be green on the default branch before a tag is pushed. This
# workflow therefore contains no test execution — it only packages
# artifacts that have already been validated by the PR gate.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create GitHub Release + attach assets
  packages: write   # push to ghcr.io

env:
  CARGO_TERM_COLOR: always
  REGISTRY_IMAGE: ghcr.io/jmcgrath207/conproxy
  HELM_OCI: oci://ghcr.io/jmcgrath207/charts

jobs:
  # Cross-compile for the two Linux targets documented for the
  # installable artifact. Skipped on workflow_dispatch by default to keep
  # manual runs fast; trigger via tag push for real releases.
  cross:
    name: cross (${{ matrix.target }})
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            description: x86_64 Linux (musl, static)
          - target: aarch64-unknown-linux-gnu
            description: aarch64 Linux (glibc)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross + host linker (build-scripts use .cargo/config.toml clang)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld
          cargo install cross --locked
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-cross-${{ matrix.target }}-${{ runner.os }}
          cache-on-failure: true
      - name: Cross build (release bundle)
        # Host build-scripts honor .cargo/config.toml (clang+lld). Cross.toml
        # pre-build installs those inside the image; also set env so a missing
        # clang on the runner host cannot break proc-macro builds.
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
        run: cross build --release --features release --target ${{ matrix.target }} --bin conproxy
      - name: Upload cross artifact
        uses: actions/upload-artifact@v4
        with:
          name: conproxy-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/conproxy
          if-no-files-found: error
          retention-days: 30

  # Smoke the aarch64 cross artifact under qemu-user (no rebuild).
  aarch64-smoke:
    name: aarch64 smoke (qemu)
    needs: cross
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download aarch64 artifact
        uses: actions/download-artifact@v4
        with:
          name: conproxy-aarch64-unknown-linux-gnu
          path: bin
      - name: Install qemu-user + smoke --version
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static
          chmod +x bin/conproxy
          qemu-aarch64-static bin/conproxy --version
          qemu-aarch64-static bin/conproxy --help 2>&1 | head -20

  # Build + publish multi-arch container image to GHCR.
  # Native runners per arch (arm64 via ubuntu-24.04-arm — avoids slow qemu).
  container:
    name: container (${{ matrix.platform }})
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # platform = buildx platforms= value; tag_suffix must be docker-tag-safe (no /)
          - platform: linux/amd64
            tag_suffix: linux-amd64
            runner: ubuntu-latest
            description: x86_64
          - platform: linux/arm64
            tag_suffix: linux-arm64
            runner: ubuntu-24.04-arm
            description: aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Set VERSION from tag
        id: v
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push (per arch, multi-arch manifest assembled in publish job)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ steps.v.outputs.VERSION }}-${{ matrix.tag_suffix }}
          labels: |
            org.opencontainers.image.title=conproxy
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.v.outputs.VERSION }}
          cache-from: type=gha,scope=container-${{ matrix.tag_suffix }}
          cache-to: type=gha,scope=container-${{ matrix.tag_suffix }},mode=max
      - name: Smoke image
        run: |
          docker run --rm ${{ env.REGISTRY_IMAGE }}:${{ steps.v.outputs.VERSION }}-${{ matrix.tag_suffix }} --version
          docker run --rm ${{ env.REGISTRY_IMAGE }}:${{ steps.v.outputs.VERSION }}-${{ matrix.tag_suffix }} --help 2>&1 | head -20

  # Assemble the multi-arch manifest + re-tag with the version-only
  # tags. Runs once per tag after every per-arch image is pushed.
  container-publish:
    name: container (manifest)
    needs: container
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set VERSION from tag
        id: v
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create + push multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY_IMAGE }}:${{ steps.v.outputs.VERSION }} \
            --tag ${{ env.REGISTRY_IMAGE }}:v${{ steps.v.outputs.VERSION }} \
            --tag ${{ env.REGISTRY_IMAGE }}:latest \
            ${{ env.REGISTRY_IMAGE }}:${{ steps.v.outputs.VERSION }}-linux-amd64 \
            ${{ env.REGISTRY_IMAGE }}:${{ steps.v.outputs.VERSION }}-linux-arm64
      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.v.outputs.VERSION }}

  # Build + publish the Helm chart as an OCI artifact on GHCR.
  # Also stages the .tgz so github-release can attach it.
  helm:
    name: helm
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set VERSION from tag
        id: v
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Stamp chart version + appVersion
        working-directory: deploy/helm/conproxy
        run: |
          VERSION=${{ steps.v.outputs.VERSION }}
          sed -i.bak -E "s/^version:.*/version: ${VERSION}/" Chart.yaml
          sed -i.bak -E 's/^appVersion:.*/appVersion: "'"${VERSION}"'"/' Chart.yaml
          rm -f Chart.yaml.bak
          cat Chart.yaml
      - name: helm lint
        working-directory: deploy/helm/conproxy
        run: helm lint .
      - name: helm template (smoke)
        working-directory: deploy/helm/conproxy
        run: |
          helm template test . --set hostIP=127.0.0.1 > /tmp/rendered.yaml
          echo "--- rendered ---"; head -30 /tmp/rendered.yaml
      - name: helm package
        working-directory: deploy/helm/conproxy
        run: |
          helm package . --version ${{ steps.v.outputs.VERSION }} \
            --app-version ${{ steps.v.outputs.VERSION }} -d dist/
          ls -la dist/
      - name: Log in to GHCR (helm)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username ${{ github.actor }} --password-stdin
      - name: helm push (OCI)
        working-directory: deploy/helm/conproxy
        run: |
          helm push dist/conproxy-${{ steps.v.outputs.VERSION }}.tgz ${{ env.HELM_OCI }}
      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: conproxy-chart
          path: deploy/helm/conproxy/dist/conproxy-${{ steps.v.outputs.VERSION }}.tgz
          if-no-files-found: error
          retention-days: 30

  # Create the GitHub Release and attach cross binaries + chart .tgz.
  github-release:
    name: github-release
    needs: [cross, helm, container-publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List artifacts
        run: find artifacts -maxdepth 3 -type f | sort
      - name: Set VERSION
        id: v
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Create release + attach assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## conproxy ${{ steps.v.outputs.VERSION }}

            Install:

            ```bash
            # cargo (binary)
            cargo install --git https://github.com/${{ github.repository }} \
              --tag ${{ github.ref_name }} --locked --features release

            # docker (multi-arch: amd64 + arm64)
            docker pull ${{ env.REGISTRY_IMAGE }}:${{ steps.v.outputs.VERSION }}

            # helm (OCI)
            helm install conproxy ${{ env.HELM_OCI }}/conproxy \
              --version ${{ steps.v.outputs.VERSION }}
            ```
          files: |
            artifacts/conproxy-x86_64-unknown-linux-musl/conproxy
            artifacts/conproxy-aarch64-unknown-linux-gnu/conproxy
            artifacts/conproxy-chart/conproxy-${{ steps.v.outputs.VERSION }}.tgz
          fail_on_unmatched_files: false
