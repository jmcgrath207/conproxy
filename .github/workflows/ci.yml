# conproxy CI — Tier-2 PR gate.
#
# Two jobs start in parallel on every PR and on push to the default
# branch. A third job (e2e) is gated on both passing, so we never
# burn e2e time (Docker services + load-data + ignored suite) when
# the cheaper gates would block the merge anyway.
#
#   1. unit          — fmt, clippy (all feature surfaces), lib tests
#                      (default / embed-api / mcp / release), build
#                      (workspace + embed), mcp_test, release binary
#                      smoke + install-sim, audit-known-gaps.
#   2. integration   — testcontainers-backed real-backend proofs
#                      (qdrant, ES, OS, meili, pgvector, cascade,
#                      peer, circuit, batch, metrics, context_config,
#                      singleflight). Runs `make test-integration`.
#   3. e2e           — needs: [unit, integration]. Real ignored
#                      e2e_proxy suite via `make e2e-smoke-core`
#                      (compose up → load-data → smoke/health/query
#                      filter). Out of PR scope: e2e_eval (LLM),
#                      full ignored suite, PGO, cross — stay in
#                      `.github/workflows/release.yml` (Tier 3).
#
# Cache strategy:
#   - Swatinem/rust-cache@v2 on every cargo job.
#   - `shared-key: "ci-<job>-<os>"` so cache keys are stable across
#     renames but isolated per job type.
#   - `cache-on-failure: true` so a failing build still leaves a warm
#     cache for the next attempt.
name: ci

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: unit (starts immediately)
  # ---------------------------------------------------------------------------
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc + python3-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler python3-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-unit-${{ runner.os }}
          cache-on-failure: true
      - name: Format
        run: cargo fmt -- --check
      - name: Clippy (lib, all feature surfaces)
        run: |
          cargo clippy --lib -- -D warnings
          cargo clippy --features embed-api --lib -- -D warnings
          cargo clippy --features persistence --lib -- -D warnings
          cargo clippy --features mcp --lib -- -D warnings
          cargo clippy --features pgvector --lib -- -D warnings
          cargo clippy --features linux-sandbox --lib -- -D warnings
          cargo clippy --features release --lib -- -D warnings
      - name: Clippy (bins)
        run: |
          cargo clippy --bin perf_summarize -- -D warnings
          cargo clippy --features tokio-console --bin conproxy -- -D warnings
      - name: Lib tests (default / embed-api / mcp / release)
        run: |
          cargo test --lib
          cargo test --features embed-api --lib
          cargo test --features mcp --lib
          cargo test --features release --lib
      - name: MCP integration test
        run: cargo test --features mcp --test mcp_test
      - name: Build (workspace)
        run: cargo build --workspace
      - name: Build (embed linker, hard gate)
        run: cargo build --features embed --lib
      - name: Release binary smoke
        run: |
          cargo build --release --features release --bin conproxy
          ./target/release/conproxy --version
          ./target/release/conproxy --help 2>&1 | head -40
      - name: Install simulation (isolated --root)
        run: |
          cargo install --locked --path . --features release --root /tmp/conproxy-install
          /tmp/conproxy-install/bin/conproxy --version
          rm -rf /tmp/conproxy-install

  # ---------------------------------------------------------------------------
  # Job 2: integration (starts immediately, parallel with unit)
  # Uses testcontainers — does NOT use GitHub Actions `services:`.
  # ---------------------------------------------------------------------------
  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc + python3-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler python3-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-integration-${{ runner.os }}
          cache-on-failure: true
      - name: Core testcontainers matrix
        # Pulls + drives real backend containers for: qdrant, ES, OS,
        # meili, pgvector, plus cascade / peer / circuit / batch /
        # metrics / context_config / singleflight. Stays under ~10
        # min on a standard ubuntu-latest runner.
        run: make test-integration

  # ---------------------------------------------------------------------------
  # Job 3: e2e (gated on unit + integration)
  # ---------------------------------------------------------------------------
  e2e:
    name: e2e
    needs: [unit, integration]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc + python3-dev + docker compose plugin
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler python3-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-e2e-${{ runner.os }}
          cache-on-failure: true
      - name: Build release binary (conproxy)
        run: cargo build --release --features release --bin conproxy
      - name: Bring up backends (docker compose)
        run: |
          cd tests/e2e
          docker compose up -d
      - name: Wait for backends
        run: |
          cargo build --bin test_runner --features default -q
          cargo run --bin test_runner --features default -- wait all
      - name: Load test data
        run: cargo run --bin test_runner --features default -- load-data
      - name: Smoke e2e suite
        # `e2e-smoke-core` runs the ignored `e2e_proxy_suite` filtered
        # to smoke/health/query. Heavier suites (cascade, full
        # e2e_eval) stay in release.yml.
        run: make e2e-smoke-core
      - name: Tear down backends
        if: always()
        run: |
          cd tests/e2e
          docker compose down -v || true
