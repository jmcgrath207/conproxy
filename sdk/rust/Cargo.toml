[package]
name = "conproxy-sdk"
version = "0.1.0"
edition = "2021"
description = "Rust SDK client for conproxy cache proxy"
license = "MIT"

[dependencies]
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen"] }
tonic-prost = { version = "0.14" }
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }
tokio = { version = "1", features = ["rt", "macros"] }
tokio-stream = { version = "0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", features = ["parse", "serde"] }
dirs = "6"
thiserror = "2"

[build-dependencies]
tonic-build = { version = "0.14", features = ["transport"] }
tonic-prost-build = { version = "0.14" }
