[package]
name = "conproxy-python"
version = "0.1.0"
edition = "2021"

[lib]
name = "conproxy"
crate-type = ["cdylib"]

[dependencies]
conproxy-sdk = { path = "../rust" }
pyo3 = { version = "0.29", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1"
