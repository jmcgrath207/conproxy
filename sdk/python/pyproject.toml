[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "conproxy"
description = "Python SDK for conproxy — retrieval cache for agentic RAG"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
]

[project.urls]
Homepage = "https://github.com/jmcgrath207/conproxy"
Documentation = "https://github.com/jmcgrath207/conproxy/blob/main/docs/sdk-python.md"
Repository = "https://github.com/jmcgrath207/conproxy"

[project.optional-dependencies]
onnx = []
persist = []
langchain = ["langchain-core>=0.1,<1.0"]
llama-index = ["llama-index-core>=0.10,<1.0"]

[tool.maturin]
features = ["pyo3/extension-module"]
