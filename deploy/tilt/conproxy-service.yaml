# ClusterIP service for conproxy LLM dev.
# Tilt port-forwards 9999/10000 automatically.

apiVersion: v1
kind: Service
metadata:
  name: conproxy
  labels:
    app: conproxy
    tilt-env: dev
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 9999
      targetPort: grpc
      protocol: TCP
    - name: http
      port: 10000
      targetPort: http
      protocol: TCP
  selector:
    app: conproxy
