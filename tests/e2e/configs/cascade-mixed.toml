# Plan 09: context-rooted dual-upstream cascade for e2e-cascade.
# Primary qdrant + secondary meilisearch (priority order).

[server]
listen = "127.0.0.1:8080"

[upstreams.qdrant]
url = "http://localhost:6333"
type = "qdrant"
index = "conproxy_test"

[upstreams.meili]
url = "http://localhost:7700"
type = "meilisearch"
index = "conproxy_test"
api_key = "conproxy_test_key"

[contexts.default]
default = true

[[contexts.default.upstreams]]
ref = "qdrant"
priority = 0

[[contexts.default.upstreams]]
ref = "meili"
priority = 1

[contexts.default.cascade]
enabled = true
threshold = 0.85
max_depth = 2
