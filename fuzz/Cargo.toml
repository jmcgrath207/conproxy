[package]
name = "conproxy-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dependencies.conproxy]
path = ".."

[[bin]]
name = "fuzz_query_request"
path = "fuzz_targets/fuzz_query_request.rs"
doc = false

[[bin]]
name = "fuzz_config_parse"
path = "fuzz_targets/fuzz_config_parse.rs"
doc = false

[[bin]]
name = "fuzz_es_response"
path = "fuzz_targets/fuzz_es_response.rs"
doc = false

[[bin]]
name = "fuzz_qdrant_response"
path = "fuzz_targets/fuzz_qdrant_response.rs"
doc = false

[[bin]]
name = "fuzz_schema_fingerprint"
path = "fuzz_targets/fuzz_schema_fingerprint.rs"
doc = false

[workspace]
members = ["."]
